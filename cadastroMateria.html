<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/cadastro.css">
    <title>Monitora+ | Cadastro Monitor</title>

</head>
<body>
    <div class="cadastro-container">
        <div class="cadastro-card">
            <div class="cadastro-header">
                <span class="cadastro-badge">Cadastro</span>
                <h1>Monitora+ | Cadastro Monitor</h1>
                <p class="subtitle">Preencha os dados do monitor para cadastrá-lo.</p>
            </div>

            <!-- Área de mensagens -->
            <div id="mensagem" class="mensagem"></div>

            <!-- Formulário -->
            <form id="formMonitor" class="cadastro-form">
            
              <!-- Matéria -->
            <div class="form-group">
                <label for="Nome">Nome</label>
                <textarea 
                    id="nomeMonitor" 
                    name="nomeMonitor"
                    placeholder="Nome do Monitor" required
                    maxlength="100"
                ></textarea>
            </div>
            
            
                <!-- email -->
            <div class="form-group">
                <label for="nome">
                    Email Monitor <span class="required">*</span>
                </label>
                <input 
                    type="email" 
                    id="emailMonitor" 
                    name="emailMonitor"
                    placeholder="seu@gmail.com" required
                    maxlength="150"
                />
            </div>

          

            <div class="senha">
                <div class="form-group">
                    <label for="senha">
                        Senha <span class="required">*</span>
                    </label>
                    <input 
                        type="password" 
                        id="senha" 
                        name="senha"
                        placeholder="********" required
                        maxlength="100"
                    />




                <div class="form-group">
                    <label for="area">
                        Área <span class="required">*</span>
                    </label>
                    <select id="areaId" name="areaId" required>
                        <option value="">Carregando áreas...</option>
                    </select>
                </div>
            </div>

            <!-- BOTÕES -->
            <div class="btn-group">
                <button type="button" class="btn-secondary" onclick="limparFormulario()">
                    🗑️ Limpar
                </button>
                <button type="submit" class="btn-primary" id="btnEnviar">
                    💾 Cadastrar Monitor
                </button>
            </div>
            </form>
        </div>
    </div>

    <script>
        // ========================================
        // CONFIGURAÇÃO
        // ========================================
        const API_URL = 'http://10.124.75.2:8080/api/v1';

        // ========================================
        // ELEMENTOS DO DOM
        // ========================================
        const form = document.getElementById('formProduto');
        const mensagem = document.getElementById('mensagem');
        const btnEnviar = document.getElementById('btnEnviar');
        const selectCategoria = document.getElementById('categoriaId');

        // ========================================
        // MOSTRAR MENSAGEM
        // ========================================
        function mostrarMensagem(texto, tipo = 'sucesso') {
            mensagem.textContent = texto;
            mensagem.className = `mensagem ${tipo}`;

            // Esconde automaticamente após 5 segundos (exceto erro)
            if (tipo !== 'erro') {
                setTimeout(() => {
                    mensagem.className = 'mensagem';
                }, 5000);
            }
        }

        // ========================================
        // CARREGAR CATEGORIAS NO SELECT
        // ========================================
        async function carregarCategorias() {
            try {
                const resposta = await fetch(`${API_URL}/categorias/ativas`);

                if (!resposta.ok) {
                    throw new Error(`HTTP ${resposta.status}`);
                }

                const categorias = await resposta.json();

                // Limpa o select
                selectCategoria.innerHTML = '<option value="">Selecione uma categoria</option>';

                // Adiciona as categorias
                categorias.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat.id;
                    option.textContent = `${cat.icone || '📦'} ${cat.nome}`;
                    selectCategoria.appendChild(option);
                });

                console.log(`✅ ${categorias.length} categorias carregadas`);

            } catch (erro) {
                console.error('❌ Erro ao carregar categorias:', erro);
                selectCategoria.innerHTML = '<option value="">❌ Erro ao carregar categorias</option>';
                mostrarMensagem('Erro ao carregar categorias. Verifique se o back-end está rodando.', 'erro');
            }
        }

        // ========================================
        // ENVIAR FORMULÁRIO (POST)
        // ========================================
        form.addEventListener('submit', async (evento) => {
            evento.preventDefault(); // Não recarrega a página

            // Desabilita o botão
            btnEnviar.disabled = true;
            btnEnviar.innerHTML = '<span class="spinner"></span> Cadastrando...';

            try {
                // ========================================
                // MONTA O OBJETO COM OS DADOS
                // ========================================
                const dados = {
                    nome: document.getElementById('nome').value.trim(),
                    descricao: document.getElementById('descricao').value.trim() || null,
                    preco: parseFloat(document.getElementById('preco').value),
                    precoPromocional: document.getElementById('precoPromocional').value 
                        ? parseFloat(document.getElementById('precoPromocional').value) 
                        : null,
                    tempoPreparo: parseInt(document.getElementById('tempoPreparo').value),
                    categoriaId: parseInt(document.getElementById('categoriaId').value),
                    ingredientes: document.getElementById('ingredientes').value.trim() || null,
                    peso: document.getElementById('peso').value.trim() || null,
                    imagem: document.getElementById('imagem').value.trim() || null,
                    destaque: document.getElementById('destaque').checked,
                    disponivel: document.getElementById('disponivel').checked
                };

                // ========================================
                // VALIDAÇÕES
                // ========================================
                if (!dados.nome) {
                    throw new Error('O nome do produto é obrigatório');
                }

                if (!dados.preco || dados.preco <= 0) {
                    throw new Error('O preço deve ser maior que zero');
                }

                if (!dados.tempoPreparo || dados.tempoPreparo <= 0) {
                    throw new Error('O tempo de preparo deve ser maior que zero');
                }

                if (!dados.categoriaId) {
                    throw new Error('Selecione uma categoria');
                }

                if (dados.precoPromocional && dados.precoPromocional >= dados.preco) {
                    throw new Error('O preço promocional deve ser menor que o preço normal');
                }

                console.log('📤 Enviando dados:', dados);

                // ========================================
                // FAZ O POST PARA A API
                // ========================================
                const resposta = await fetch(`${API_URL}/produtos`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(dados)
                });

                // ========================================
                // TRATA A RESPOSTA
                // ========================================
                if (!resposta.ok) {
                    // Tenta pegar a mensagem de erro do back-end
                    let mensagemErro = `Erro HTTP ${resposta.status}`;
                    
                    try {
                        const erroData = await resposta.json();
                        if (erroData.message) {
                            mensagemErro = erroData.message;
                        } else if (erroData.errors) {
                            mensagemErro = Object.values(erroData.errors).join(', ');
                        }
                    } catch (e) {
                        // Ignora se não conseguir ler o JSON
                    }
                    
                    throw new Error(mensagemErro);
                }

                const produtoCriado = await resposta.json();
                console.log('✅ Produto criado:', produtoCriado);

                // ========================================
                // SUCESSO!
                // ========================================
                mostrarMensagem(
                    `✅ Produto "${produtoCriado.nome}" cadastrado com sucesso! (ID: ${produtoCriado.id})`,
                    'sucesso'
                );

                // Limpa o formulário (mantém disponível marcado)
                limparFormulario();

            } catch (erro) {
                console.error('❌ Erro:', erro);
                mostrarMensagem(`❌ ${erro.message}`, 'erro');
            } finally {
                // Reabilita o botão
                btnEnviar.disabled = false;
                btnEnviar.innerHTML = '💾 Cadastrar Produto';
            }
        });

        // ========================================
        // LIMPAR FORMULÁRIO
        // ========================================
        function limparFormulario() {
            form.reset();
            
            // Mantém "disponível" marcado por padrão
            document.getElementById('disponivel').checked = true;
            document.getElementById('destaque').checked = false;
            
            // Foca no primeiro campo
            document.getElementById('nome').focus();
        }

        // ========================================
        // INICIALIZAÇÃO
        // ========================================
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🍰 Cadastro de Produtos iniciado');
            carregarCategorias();
        });
    </script>
</body>
</html>

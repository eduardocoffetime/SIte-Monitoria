<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/cadastroDisciplina.css">
    <title>Monitora+ | Cadastro Disciplina</title>
    <a href="guia.html" class="btn-home-img">
    <img src="img\home.png" alt="Home">
    </a>
</head>
<body>
    <div class="cadastroDisc-container">
        <div class="cadastroDisc-card">
            <div class="cadastroDisc-header">
                <span class="cadastro-badge">Cadastro</span>
                <h1>Monitora+ | Cadastro Disciplina</h1>
                <p class="subtitle">Preencha os dados da disciplina para cadastrá-la.</p>
            </div>

            <!-- Área de mensagens -->
            <div id="mensagem" class="mensagem"></div>

            <!-- Formulário -->
            <form id="formDisciplina" class="cadastro-form">

                <!-- Área (dropdown) -->
                <div class="form-group">
                    <label for="areaDisciplina">Área<span class="required">*</span></label>
                    <select id="areaDisciplina" name="areaDisciplina" required>
                        <option value="">Carregando áreas...</option>
                    </select>
                </div>

                <!-- Disciplina -->
                <div class="form-group">
                    <label for="nomeDisciplina">Disciplina<span class="required">*</span></label>
                    <input
                        type="text"
                        id="nomeDisciplina"
                        name="nomeDisciplina"
                        placeholder="Nome da Disciplina"
                        required
                        maxlength="60"
                        minlength="3"
                    />
                </div>

                <!-- Descrição -->
                <div class="form-group">
                    <label for="DescricaoDisciplina">Descrição</label>
                    <input
                        type="text"
                        id="DescricaoDisciplina"
                        name="DescricaoDisciplina"
                        placeholder="Descrição da Disciplina"
                        maxlength="60"
                        minlength="0"
                    />
                </div>

                <div class="form-actions">
                    <button type="reset" class="btn-limpar">Limpar</button>
                    <button type="submit" class="btn-cadastrar">Cadastrar disciplina</button>
                </div>
            </form>
            <nav class="atalhos-cadastro" aria-label="Navegação de cadastros">
                <a href="listagemDisciplina.html">Ver disciplinas</a>
                <a href="cadastroArea.html">Cadastrar área</a>
            </nav>
        </div>
    </div>
    <script src="assets/catalogo.js"></script>
    <script>
        const form = document.getElementById('formDisciplina');
        const selectArea = document.getElementById('areaDisciplina');
        const mensagem = document.getElementById('mensagem');
        MonitoraCatalogo.prepararDemonstracao();
        const areas = MonitoraCatalogo.ler('areas');

        selectArea.replaceChildren(new Option('Selecione uma área', ''));
        areas.forEach((area) => selectArea.add(new Option(area.nome, area.id)));

        form.addEventListener('submit', (evento) => {
            evento.preventDefault();
            const area = areas.find((item) => String(item.id) === selectArea.value);
            const nome = document.getElementById('nomeDisciplina').value.trim();
            const descricao = document.getElementById('DescricaoDisciplina').value.trim();
            const disciplinas = MonitoraCatalogo.ler('disciplinas');

            if (!area) {
                mensagem.textContent = 'Selecione uma área cadastrada.';
                mensagem.className = 'mensagem erro';
                return;
            }
            if (disciplinas.some((disciplina) => String(disciplina.areaId) === String(area.id)
                && disciplina.nome.toLocaleLowerCase('pt-BR') === nome.toLocaleLowerCase('pt-BR'))) {
                mensagem.textContent = 'Essa disciplina já está cadastrada nessa área.';
                mensagem.className = 'mensagem erro';
                return;
            }

            disciplinas.push({ id: MonitoraCatalogo.criarId(), nome, descricao, areaId: area.id, areaNome: area.nome });
            if (!MonitoraCatalogo.salvar('disciplinas', disciplinas)) {
                mensagem.textContent = 'Não foi possível salvar a disciplina neste navegador.';
                mensagem.className = 'mensagem erro';
                return;
            }

            mensagem.textContent = `Disciplina "${nome}" cadastrada com sucesso.`;
            mensagem.className = 'mensagem sucesso';
            form.reset();
        });
    </script>
</body>
</html>

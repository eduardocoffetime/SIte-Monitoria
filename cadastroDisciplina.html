<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/cadastroDisciplina.css">
    <title>Monitora+ | Cadastro Disciplina</title>
</head>
<body>
    <div class="cadastroArea-container">
        <div class="cadastroArea-card">
            <div class="cadastroArea-header">
                <span class="cadastro-badge">Cadastro</span>
                <h1>Monitora+ | Cadastro Disciplina</h1>
                <p class="subtitle">Preencha os dados da disciplina para cadastrá-la.</p>
            </div>

            <!-- Área de mensagens -->
            <div id="mensagem" class="mensagem"></div>

            <!-- Formulário -->
            <form id="formMonitor" class="cadastro-form">
            
              <!-- Disciplina -->
            <div class="form-group">
                <label for="nomeMonitor">área</label>
                <input 
                    type="text" 
                    id="nomeArea" 
                    name="nomeArea"
                    placeholder="Nome da Area" required
                    maxlength="60"
                    minlength="3"
                />
            </div>

              <!-- área -->
            <div class="form-group">
                <label for="nomeMonitor">Disciplina</label>
                <input 
                    type="text" 
                    id="nomeDisciplina" 
                    name="nomeDisciplina"
                    placeholder="Nome da Disciplina" required
                    maxlength="60"
                    minlength="3"
                />
            </div>

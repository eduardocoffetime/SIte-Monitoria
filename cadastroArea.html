<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/cadastroDisciplina.css">
    <title>Monitora+ | Cadastro Área</title>
</head>
<body>
    <div class="form-group">
                    <label for="nomeDisciplina">Área<span class="required">*</span></label>
                    <input
                        type="text"
                        id="nomeArea"
                        name="nomeArea"
                        placeholder="Nome da Área"
                        required
                        maxlength="60"
                        minlength="3"
                    />
                </div>
                <div class="form-actions">
                    <button type="reset" class="btn-limpar">Limpar</button>
                    <button type="submit" class="btn-cadastrar">Cadastrar disciplina</button>
                </div>
</body>

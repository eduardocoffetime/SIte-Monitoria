<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/cadastro.css">
    <title>Monitora+ | Cadastro Monitor</title>
    <a href="guia.html" class="btn-home-img">
    <img src="img\home.png" alt="Home">
    </a>
</head>
<body>
    <div class="cadastro-container">
        <div class="cadastro-card">
            <div class="cadastro-header">
                <span class="cadastro-badge">Cadastro</span>
                <h1>Monitora+ | Cadastro Monitor</h1>
                <p class="subtitle">Preencha os dados do monitor para cadastrá-lo.</p>
                <a class="link-listagem" href="listagemMonitor.html">Ver lista de monitores</a>
                <nav aria-label="Listagens do catálogo">
                    <a class="link-listagem" href="listagemArea.html">Áreas</a>
                    <a class="link-listagem" href="listagemDisciplina.html">Disciplinas</a>
                </nav>
            </div>

            <!-- Área de mensagens -->
            <div id="mensagem" class="mensagem"></div>

            <form id="formMonitor" class="cadastro-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nomeMonitor">Nome <span class="required">*</span></label>
                        <input type="text" id="nomeMonitor" name="nome" placeholder="Nome do monitor" required maxlength="60" minlength="3">
                    </div>
                    <div class="form-group">
                        <label for="emailMonitor">Email <span class="required">*</span></label>
                        <input type="email" id="emailMonitor" name="email" placeholder="monitor@escola.edu.br" required maxlength="150">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="telefoneMonitor">Telefone <span class="required">*</span></label>
                        <input type="tel" id="telefoneMonitor" name="telefone" placeholder="(11) 99999-9999" autocomplete="tel" required maxlength="20">
                    </div>
                    <div class="form-group">
                        <label for="senha">Senha <span class="required">*</span></label>
                        <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" required minlength="6" maxlength="100" pattern="(?=.*[A-Z])(?=.*[^A-Za-z0-9]).{6,}" title="A senha deve ter pelo menos 6 caracteres, uma letra maiúscula e um caractere especial.">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="areaId">Área <span class="required">*</span></label>
                        <select id="areaId" name="areaId" required>
                            <option value="">Carregando áreas...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="disciplinaId">Disciplina <span class="required">*</span></label>
                        <select id="disciplinaId" name="disciplinaId" required>
                            <option value="">Carregando disciplinas...</option>
                        </select>
                    </div>
                </div>

                <section class="atendimento" aria-labelledby="tituloAtendimento">
                    <div class="atendimento-header">
                        <div>
                            <h2 id="tituloAtendimento">Horários de atendimento</h2>
                            <p>Informe o dia e o intervalo de cada monitoria.</p>
                        </div>
                        <button type="button" class="btn-adicionar" id="adicionarHorario">+ Adicionar horário</button>
                    </div>
                    <div id="horarios" class="horarios-lista"></div>
                </section>

                <div class="btn-group">
                    <button type="button" class="btn-secondary" id="limparFormulario">Limpar</button>
                    <button type="submit" class="btn-primary" id="btnEnviar">Cadastrar monitor</button>
                </div>
            </form>
        </div>
    </div>
    <script src="assets/catalogo.js"></script>
    <script>
        const form = document.getElementById('formMonitor');
        const mensagem = document.getElementById('mensagem');
        const btnEnviar = document.getElementById('btnEnviar');
        const selectArea = document.getElementById('areaId');
        const selectDisciplina = document.getElementById('disciplinaId');
        const horarios = document.getElementById('horarios');
        const diasSemana = ['Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado', 'Domingo'];

        function mostrarMensagem(texto, tipo = 'sucesso') {
            mensagem.textContent = texto;
            mensagem.className = `mensagem ${tipo}`;
            if (tipo !== 'erro') window.setTimeout(() => mensagem.className = 'mensagem', 5000);
        }

        function validarSenha(senha) {
            if (senha.length < 6) return 'A senha deve ter no mínimo 6 caracteres.';
            if (!/[A-Z]/.test(senha)) return 'A senha deve conter pelo menos uma letra maiúscula.';
            if (!/[^A-Za-z0-9]/.test(senha)) return 'A senha deve conter pelo menos um caractere especial.';
            return '';
        }

        function carregarAreas() {
            MonitoraCatalogo.prepararDemonstracao();
            const areas = MonitoraCatalogo.ler('areas');
            selectArea.replaceChildren(new Option(areas.length ? 'Selecione uma área' : 'Cadastre uma área primeiro', ''));
            areas.forEach((area) => selectArea.add(new Option(area.nome, area.id)));
            selectArea.disabled = areas.length === 0;
            carregarDisciplinas();
        }

        function carregarDisciplinas() {
            const disciplinas = MonitoraCatalogo.ler('disciplinas');
            const areaId = selectArea.value;
            const filtradas = disciplinas.filter((disciplina) => String(disciplina.areaId) === areaId);
            selectDisciplina.replaceChildren(new Option(
                !areaId ? 'Selecione uma área primeiro' : filtradas.length ? 'Selecione uma disciplina' : 'Nenhuma disciplina nesta área',
                ''
            ));
            filtradas.forEach((disciplina) => selectDisciplina.add(new Option(disciplina.nome, disciplina.id)));
            selectDisciplina.disabled = filtradas.length === 0;
        }

        function adicionarHorario() {
            const linha = document.createElement('div');
            linha.className = 'horario-linha';
            linha.innerHTML = `
                <label class="horario-campo">Dia
                    <select name="diaAtendimento" required>
                        <option value="">Selecione</option>
                        ${diasSemana.map((dia) => `<option value="${dia}">${dia}</option>`).join('')}
                    </select>
                </label>
                <label class="horario-campo">Das
                    <input type="time" name="inicioAtendimento" required>
                </label>
                <label class="horario-campo">Até
                    <input type="time" name="fimAtendimento" required>
                </label>
                <button type="button" class="btn-remover" aria-label="Remover horário" title="Remover horário">Remover</button>`;
            linha.querySelector('.btn-remover').addEventListener('click', () => {
                linha.remove();
                if (!horarios.children.length) adicionarHorario();
            });
            horarios.appendChild(linha);
        }

        document.getElementById('adicionarHorario').addEventListener('click', adicionarHorario);
        selectArea.addEventListener('change', carregarDisciplinas);
        document.getElementById('limparFormulario').addEventListener('click', () => {
            form.reset();
            horarios.innerHTML = '';
            adicionarHorario();
            document.getElementById('nomeMonitor').focus();
        });

        form.addEventListener('submit', (evento) => {
            evento.preventDefault();
            const nome = document.getElementById('nomeMonitor').value.trim();
            const email = document.getElementById('emailMonitor').value.trim();
            const telefone = document.getElementById('telefoneMonitor').value.trim();
            const senha = document.getElementById('senha').value;
            const area = MonitoraCatalogo.ler('areas').find((item) => String(item.id) === selectArea.value);
            const disciplina = MonitoraCatalogo.ler('disciplinas').find((item) => String(item.id) === selectDisciplina.value);
            const erroSenha = validarSenha(senha);
            const atendimentos = [...horarios.querySelectorAll('.horario-linha')].map((linha) => ({
                dia: linha.querySelector('[name="diaAtendimento"]').value,
                inicio: linha.querySelector('[name="inicioAtendimento"]').value,
                fim: linha.querySelector('[name="fimAtendimento"]').value
            }));

            if (erroSenha) {
                mostrarMensagem(erroSenha, 'erro');
                document.getElementById('senha').focus();
                return;
            }
            if (atendimentos.some((horario) => horario.inicio >= horario.fim)) {
                mostrarMensagem('O horário final deve ser posterior ao horário inicial.', 'erro');
                return;
            }
            if (!area || !disciplina) {
                mostrarMensagem('Cadastre e selecione uma área e uma disciplina.', 'erro');
                return;
            }

            const atendimento = atendimentos.map((horario) => `${horario.dia}: ${horario.inicio} às ${horario.fim}`).join('; ');
            const monitores = MonitoraCatalogo.ler('monitores');
            const monitor = {
                id: MonitoraCatalogo.criarId(),
                nome,
                email,
                telefone,
                areaId: area.id,
                area: area.nome,
                disciplinaId: disciplina.id,
                disciplina: disciplina.nome,
                atendimento
            };
            if (!MonitoraCatalogo.salvar('monitores', [...monitores, monitor])) {
                mostrarMensagem('Não foi possível salvar o monitor neste navegador.', 'erro');
                return;
            }

            mostrarMensagem(`Monitor "${nome}" cadastrado neste navegador.`, 'sucesso');
            form.reset();
            horarios.innerHTML = '';
            adicionarHorario();
            carregarAreas();
        });

        carregarAreas();
        adicionarHorario();
    </script>
</body>
</html>

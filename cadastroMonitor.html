<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/cadastro.css">
    <title>Monitora+ | Cadastro Monitor</title>

</head>
<body>
    <div class="cadastro-container">
        <div class="cadastro-card">
            <div class="cadastro-header">
                <span class="cadastro-badge">Cadastro</span>
                <h1>Monitora+ | Cadastro Monitor</h1>
                <p class="subtitle">Preencha os dados do monitor para cadastrá-lo.</p>
            </div>

            <!-- Área de mensagens -->
            <div id="mensagem" class="mensagem"></div>

            <!-- Formulário -->
            <form id="formMonitor" class="cadastro-form">
            
              <!-- Matéria -->
            <div class="form-group">
                <label for="nomeMonitor">Nome</label>
                <input 
                    type="text" 
                    id="nomeMonitor" 
                    name="nomeMonitor"
                    placeholder="Nome do Monitor" required
                    maxlength="60"
                    minlength="3"
                />
            </div>
            
            
                <!-- email -->
            <div class="form-group">
                <label for="nome">
                    Email Monitor <span class="required">*</span>
                </label>
                <input 
                    type="email" 
                    id="emailMonitor" 
                    name="emailMonitor"
                    placeholder="seu@gmail.com" required
                    maxlength="150"
                />
            </div>

          

            <div class="senha">
                <div class="form-group">
                    <label for="senha">
                        Senha <span class="required">*</span>
                    </label>
                    <input 
                        type="password" 
                        id="senha" 
                        name="senha"
                        placeholder="********" required
                        minlength="6"
                        maxlength="100"
                        pattern="(?=.*[A-Z])(?=.*[^A-Za-z0-9]).{6,}"
                        title="A senha deve ter pelo menos 6 caracteres, uma letra maiúscula e um caractere especial."
                    />




                <div class="form-group">
                    <label for="area">
                        Área <span class="required">*</span>
                    </label>
                    <select id="areaId" name="areaId" required>
                        <option value="">Carregando áreas...</option>
                    </select>
                </div>
            </div>

            <!-- BOTÕES -->
            <div class="btn-group">
                <button type="button" class="btn-secondary" onclick="limparFormulario()">
                    🗑️ Limpar
                </button>
                <button type="submit" class="btn-primary" id="btnEnviar">
                    💾 Cadastrar Monitor
                </button>
            </div>
            </form>
        </div>
    </div>
    <script>
        const API_URL = 'http://10.124.75.2:8080/api/v1';

        const form = document.getElementById('formMonitor');
        const mensagem = document.getElementById('mensagem');
        const btnEnviar = document.getElementById('btnEnviar');
        const selectArea = document.getElementById('areaId');

        function mostrarMensagem(texto, tipo = 'sucesso') {
            mensagem.textContent = texto;
            mensagem.className = `mensagem ${tipo}`;

            if (tipo !== 'erro') {
                setTimeout(() => {
                    mensagem.className = 'mensagem';
                }, 5000);
            }
        }
// Validação da Senha
        function validarSenha(senha) {
            if (senha.length < 6) {
                return 'A senha deve ter no mínimo 6 caracteres.';
            }

            if (!/[A-Z]/.test(senha)) {
                return 'A senha deve conter pelo menos uma letra maiúscula.';
            }

            if (!/[^A-Za-z0-9]/.test(senha)) {
                return 'A senha deve conter pelo menos um caractere especial.';
            }

            return '';
        }

        async function carregarAreas() {
            try {
                const resposta = await fetch(`${API_URL}/areas/ativas`);

                if (!resposta.ok) {
                    throw new Error(`HTTP ${resposta.status}`);
                }

                const areas = await resposta.json();

                selectArea.innerHTML = '<option value="">Selecione a área</option>';

                areas.forEach(area => {
                    const option = document.createElement('option');
                    option.value = area.id;
                    option.textContent = area.nome;
                    selectArea.appendChild(option);
                });

                console.log(`✅ ${areas.length} áreas carregadas`);
            } catch (erro) {
                console.error('❌ Erro ao carregar áreas:', erro);
                selectArea.innerHTML = '<option value="">❌ Erro ao carregar áreas</option>';
                mostrarMensagem('Erro ao carregar áreas. Verifique se o back-end está rodando.', 'erro');
            }
        }

        form.addEventListener('submit', async (evento) => {
            evento.preventDefault();

            const nome = document.getElementById('nomeMonitor').value.trim();
            const email = document.getElementById('emailMonitor').value.trim();
            const senha = document.getElementById('senha').value;
            const areaId = document.getElementById('areaId').value;
            const erroSenha = validarSenha(senha);

            if (!nome) {
                mostrarMensagem('O nome do monitor é obrigatório.', 'erro');
                return;
            }

            if (!email) {
                mostrarMensagem('O email é obrigatório.', 'erro');
                return;
            }

            if (erroSenha) {
                mostrarMensagem(erroSenha, 'erro');
                document.getElementById('senha').focus();
                return;
            }

            if (!areaId) {
                mostrarMensagem('Selecione uma área.', 'erro');
                return;
            }

            btnEnviar.disabled = true;
            btnEnviar.innerHTML = '⏳ Cadastrando...';

            try {
                const dados = {
                    nome,
                    email,
                    senha,
                    areaId: Number(areaId)
                };

                const resposta = await fetch(`${API_URL}/monitores`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(dados)
                });

                if (!resposta.ok) {
                    let mensagemErro = `Erro HTTP ${resposta.status}`;

                    try {
                        const erroData = await resposta.json();
                        if (erroData.message) {
                            mensagemErro = erroData.message;
                        } else if (erroData.errors) {
                            mensagemErro = Object.values(erroData.errors).join(', ');
                        }
                    } catch (e) {
                        // Ignora erro de JSON diferente
                    }

                    throw new Error(mensagemErro);
                }

                const monitorCriado = await resposta.json();
                mostrarMensagem(`✅ Monitor "${monitorCriado.nome || nome}" cadastrado com sucesso!`, 'sucesso');
                limparFormulario();
            } catch (erro) {
                console.error('❌ Erro no cadastro:', erro);
                mostrarMensagem(`❌ ${erro.message}`, 'erro');
            } finally {
                btnEnviar.disabled = false;
                btnEnviar.innerHTML = '💾 Cadastrar Monitor';
            }
        });

        function limparFormulario() {
            form.reset();
            document.getElementById('nomeMonitor').focus();
        }

        document.addEventListener('DOMContentLoaded', () => {
            console.log('✅ Cadastro de monitor iniciado');
            carregarAreas();
        });
    </script>
</body>
</html>
